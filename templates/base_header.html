<script>
(function () {
    var btn = document.getElementById('sidebarToggle');
    if (!btn) return;
    var icon = btn.querySelector('i');

    function apply(collapsed) {
        document.body.classList.toggle('sidebar-collapsed', collapsed);
        icon.className = collapsed ? 'fa-solid fa-angles-right' : 'fa-solid fa-angles-left';
    }

    btn.addEventListener('click', function () {
        var next = !document.body.classList.contains('sidebar-collapsed');
        apply(next);
        try { localStorage.setItem('sidebarCollapsed', next); } catch (e) {}
    });

    try {
        if (localStorage.getItem('sidebarCollapsed') === 'true') apply(true);
    } catch (e) {}
})();
</script>
